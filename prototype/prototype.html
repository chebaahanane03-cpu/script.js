<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Counter</title>
</head>
<body>
  <label><input type="checkbox" id="m1">LMOHAWALA1</label><br>
  <label><input type="checkbox" id="m2">LMOHAWALA2</label><br>
  <label><input type="checkbox" id="m3">LMOHAWALA3</label><br>
  <label><input type="checkbox" id="m4">LMOHAWALA4</label><br>

  <div id="progress" style="margin-top:8px;">0 of 4 completed</div>

  <script>
    let One = document.getElementById('m1');
    let Two = document.getElementById('m2');
    let Three = document.getElementById('m3');
    let Four = document.getElementById('m4');

    let progressText = document.getElementById('progress');

    function refreshProgress() {
      let completed = 0;
      if (One.checked) completed++;
      if (Two.checked) completed++;
      if (Three.checked) completed++;
      if (Four.checked) completed++;

      progressText.textContent = completed + ' of 4 completed';
    }

    One.addEventListener('change', refreshProgress);
    Two.addEventListener('change', refreshProgress);
    Three.addEventListener('change', refreshProgress);
    Four.addEventListener('change', refreshProgress);

    refreshProgress();
  </script>
</body>
</html>
